name: Build wheel and publish examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYODIDE_BUILD_VERSION: "0.26.0"
  EMSDK_VERSION: "3.1.58"
  PYODIDE_TARBALL: "https://ngsolve.org/files/pyodide-0.26.0/ngsolve_pyodide.tar.bz2"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive
      - run: pip install pybind11
      - run: cmake -S . -B build -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - run: pip install . netgen-mesher pythreejs
      - run: python tests/test_python.py

  site:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Build the Pyodide wheel
        run: |
          pip install "pyodide-build==$PYODIDE_BUILD_VERSION" "wheel==0.43.0" "setuptools<80"
          source ./emsdk/emsdk_env.sh
          pyodide build
          # jupyterlite-pyodide-kernel 0.3 only indexes wheels with an emscripten tag;
          # Pyodide 0.26 accepts both names for the same ABI.
          for wheel in dist/*pyodide_2024_0_wasm32.whl; do
            mv "$wheel" "${wheel/pyodide_2024_0_wasm32/emscripten_3_1_58_wasm32}"
          done
          ls -la dist
      - name: Build the JupyterLite site
        run: |
          pip install -r site-requirements.txt
          TZ=UTC jupyter lite build --pyodide "$PYODIDE_TARBALL"
          touch site/.nojekyll
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
